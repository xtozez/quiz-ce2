<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4b1fc2">
  <title>Le Grand Quiz du CE2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bandeau de connexion (téléphone seulement) -->
  <div id="barre-connexion" hidden></div>

  <!-- Tout l'affichage du jeu se dessine ici -->
  <div id="app"></div>

  <!-- Télé : invitation à cliquer pour activer le son -->
  <div id="voile-son" hidden>🔊 Cliquez n'importe où pour activer le son et le plein écran</div>

  <!-- Télé : petit QR code qui apparaît si le téléphone est déconnecté -->
  <div id="coin-qr" hidden>
    <div class="titre">📱 Téléphone déconnecté<br>Scannez pour le reconnecter</div>
    <div class="place-qr"></div>
  </div>

  <div id="toast"></div>

  <!-- Outils gratuits chargés depuis Internet -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Les questions (fichier à modifier) puis le jeu -->
  <script src="questions.js"></script>
  <script src="jeu.js"></script>
</body>
</html>
